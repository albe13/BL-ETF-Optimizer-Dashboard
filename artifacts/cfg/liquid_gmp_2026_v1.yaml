    underlying_index: MSCI World
    geography: Developed markets, global
    fund_currency: USD
    listing_currency: USD (LSE line); workbook values requested in EUR
    hedging: Unhedged
    income_treatment: Accumulating
    proxy_quality: GOOD_PROXY
    identity_verification: VERIFIED (legacy master + issuer/listing data)
    notes: >-
      Developed-markets only; emerging-market equities (part of global equity
      in the GMP) are not represented.

