# LIQUID_GMP_2026_V1 -- frozen strategic benchmark definition.
#
# Source: State Street Global Market Portfolio 2026, with Private Debt and
# High Yield intentionally excluded and the remaining asset classes
# proportionally renormalized (renormalization performed upstream, by the user).
#
# FROZEN. These weights are never optimized, tuned on performance, or reset.
# Weights are stored as exact decimal STRINGS so the sum can be validated
# exactly (decimal.Decimal) rather than in binary floating point.
#
# Identity provenance:
#   ticker      = Bloomberg security string in the price workbook sheet header
#   isin        = verified against issuer / exchange listing data on 2026-10-06
#                 (and, where present, the legacy reconciled security master)
#   income      = distribution policy of the exact share class; it determines
#                 whether PX_LAST is a total-return-equivalent series.

benchmark_id: LIQUID_GMP_2026_V1
version: 1
base_currency: EUR
weight_sum_target: "1"
excluded_asset_classes:
  - Private Debt
  - High Yield

components:
  - asset_class: Equity
    target_weight: "0.4570"
    source_sheet: listed equity
    ticker: IWDA LN Equity
    isin: IE00B4L5Y983
